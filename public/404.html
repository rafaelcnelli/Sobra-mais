<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SobraMais — Redirecionando...</title>
    <script>
      // Redireciona rotas SPA no GitHub Pages para a raiz do repositório mantendo hash/query
      (function () {
        var pathSegments = window.location.pathname.split('/').filter(Boolean);
        var repoBase = pathSegments.length > 0 ? '/' + pathSegments[0] + '/' : '/';
        window.location.replace(repoBase + window.location.search + window.location.hash);
      })();
    </script>
  </head>
  <body style="background:#080B12;color:#fff;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0">
    <p>Redirecionando para o SobraMais...</p>
  </body>
</html>
